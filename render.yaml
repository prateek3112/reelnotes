services:
  - type: web
    name: reelvault-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_KEY
        value: reelvault-secret-api-key
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.0-flash
      - key: TRANSCRIPTION_PROVIDER
        value: whisper
      - key: WHISPER_MODEL
        value: base
      - key: GROQ_API_KEY
        sync: false
      - key: INSTAGRAM_COOKIES_TEXT
        sync: false
