name: ReelVault
options:
  bundleIdPrefix: com.reelvault
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.50.0

targets:
  ReelVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReelVault
        excludes:
          - "Info.plist"
          - "ReelVault.entitlements"
      - path: Shared
    dependencies:
      - package: Supabase
      - target: ReelVaultShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelvault.app
        INFOPLIST_FILE: ReelVault/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReelVault/ReelVault.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"

  ReelVaultShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ReelVaultShareExtension
        excludes:
          - "Info.plist"
          - "ReelVaultShareExtension.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelvault.app.share
        INFOPLIST_FILE: ReelVaultShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReelVaultShareExtension/ReelVaultShareExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
